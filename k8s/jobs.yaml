apiVersion: batch/v1
kind: Job
metadata:
  name: simple-parallel
  namespace: lab5
  labels:
    stage: parallel
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: simple-parallel
    spec:
      restartPolicy: Never
      containers:
      - name: calculate
        image: vk-lab5-simple:1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 256Mi
        env:
        - name: SOURCE
          value: s3
        - name: RUN_NAME
          value: parallel
        - name: S3_ENDPOINT
          value: http://rustfs:9000
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        envFrom:
        - secretRef:
            name: s3-credentials
  completions: 4
  parallelism: 4
  completionMode: Indexed
  activeDeadlineSeconds: 180
