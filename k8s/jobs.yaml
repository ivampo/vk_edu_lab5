apiVersion: batch/v1
kind: Job
metadata:
  name: simple-oom
  namespace: lab5
  labels:
    stage: oom
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: simple-oom
    spec:
      restartPolicy: Never
      containers:
      - name: calculate
        image: vk-lab5-simple:1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 500m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 64Mi
        env:
        - name: SOURCE
          value: local
        - name: RUN_NAME
          value: oom
        - name: S3_ENDPOINT
          value: http://rustfs:9000
        volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
        envFrom:
        - secretRef:
            name: s3-credentials
      volumes:
      - name: input
        hostPath:
          path: /lab-input
          type: Directory
  activeDeadlineSeconds: 180
---
