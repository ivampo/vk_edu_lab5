apiVersion: v1
kind: Pod
metadata:
  name: cpu-holder
  namespace: lab5
  labels:
    stage: cpu-holder
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 3
  containers:
  - name: hold
    image: vk-lab5-simple:1
    imagePullPolicy: Never
    command:
    - python
    - -u
    - -c
    - import time; print("holding CPU request", flush=True); time.sleep(3600)
    resources:
      requests:
        cpu: 2700m
        memory: 32Mi
      limits:
        cpu: 2700m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-waiter
  namespace: lab5
  labels:
    stage: cpu-waiter
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 3
  containers:
  - name: hold
    image: vk-lab5-simple:1
    imagePullPolicy: Never
    command:
    - python
    - -u
    - -c
    - import time; print("holding CPU request", flush=True); time.sleep(3600)
    resources:
      requests:
        cpu: '1'
        memory: 32Mi
      limits:
        cpu: '1'
        memory: 64Mi
