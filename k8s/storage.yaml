apiVersion: v1
kind: Namespace
metadata:
  name: lab5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: lab5
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: lab5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: prepare
        image: vk-lab5-simple:1
        imagePullPolicy: Never
        command:
        - python
        - -c
        - import os; [os.makedirs(f"/data/disk{i}", exist_ok=True) for i in range(1,5)];
          [os.chown(f"/data/disk{i}",10001,10001) for i in range(1,5)]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: rustfs
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        imagePullPolicy: IfNotPresent
        args:
        - /data/disk{1...4}
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: RUSTFS_STORAGE_CLASS_STANDARD
          value: EC:2
        - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
          value: 'true'
        - name: RUSTFS_CONSOLE_ENABLE
          value: 'false'
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-data
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lab5
spec:
  selector:
    app: rustfs
  ports:
  - port: 9000
    targetPort: 9000
  type: ClusterIP
